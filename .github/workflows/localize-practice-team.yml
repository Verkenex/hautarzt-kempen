name: Localize practice team images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/assets/team/staff/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download and optimize current practice team portraits
        run: |
          set -euo pipefail
          mkdir -p public/assets/team/staff /tmp/practice-team

          fetch() {
            url="$1"
            out="$2"
            curl -L --fail --retry 3 "$url" -o "/tmp/practice-team/source"
            convert "/tmp/practice-team/source" -auto-orient -resize '900x1100>' -strip -quality 82 "public/assets/team/staff/$out.webp"
          }

          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Barbara-Gerecht.webp' 'barbara-gerecht'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Stephanie-Worien.webp' 'stephanie-worien'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Carola-Zangs.webp' 'carola-zangs'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Jenny-Nitzer.webp' 'jenny-nitzer'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Marion-Burgtorff.webp' 'marion-burgtorff'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2025/12/Anastasia-Barbuto.webp' 'anastasia-barbuto'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Kyra-Holtmanns.webp' 'kyra-holtmanns'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Claudia-Jansen.webp' 'claudia-jansen'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2026/06/Frau_Monrose_480x480.webp' 'elena-monrose'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2025/03/dajana_saurbier.webp' 'dajana-saurbier'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2026/06/lucyna-tomalczyk.jpg' 'lucyna-tomalczyk'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2026/06/Frau_Neuhoff_480x480.webp' 'rita-neuhoff'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2025/06/tanja_goettges.png' 'tanja-goettges'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2025/06/anja_rovkin.png' 'anja-rovkin'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2025/06/max_gerecht.png' 'max-gerecht'
          fetch 'https://www.hautarzt-kempen.de/wp-content/uploads/2024/11/Michael-Liebelt.webp' 'michael-liebelt'

      - name: Commit localized team portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/team/staff
          if git diff --cached --quiet; then
            echo 'Practice team portraits already localized.'
            exit 0
          fi
          git commit -m 'Localize practice team portraits'
          git push
